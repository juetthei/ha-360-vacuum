# 360 Vacuum Robot — Dashboard Example
#
# How to use:
#   In Home Assistant: Settings → Dashboards → Edit → Raw configuration editor
#   Or add as a new dashboard card via "Manual card" and paste the content of
#   one of the card examples below.
#
# Replace "vacuum.your_robot_name" with your actual entity ID.
# Find it under Settings → Entities → search for "360" or "vacuum".
#
# ──────────────────────────────────────────────────────────────────────────────
# SINGLE ROBOT CARD
# ──────────────────────────────────────────────────────────────────────────────

type: vertical-stack
cards:

  # Status header
  - type: entity
    entity: vacuum.your_robot_name
    name: 360 Robot
    icon: mdi:robot-vacuum

  # Control buttons
  - type: horizontal-stack
    cards:
      - type: button
        name: Start
        icon: mdi:play
        tap_action:
          action: call-service
          service: vacuum.start
          target:
            entity_id: vacuum.your_robot_name

      - type: button
        name: Pause
        icon: mdi:pause
        tap_action:
          action: call-service
          service: vacuum.pause
          target:
            entity_id: vacuum.your_robot_name

      - type: button
        name: Basis
        icon: mdi:home-map-marker
        tap_action:
          action: call-service
          service: vacuum.return_to_base
          target:
            entity_id: vacuum.your_robot_name

      - type: button
        name: Stop
        icon: mdi:stop
        tap_action:
          action: call-service
          service: vacuum.stop
          target:
            entity_id: vacuum.your_robot_name

---
# ──────────────────────────────────────────────────────────────────────────────
# TWO ROBOTS SIDE BY SIDE (Glance overview)
# ──────────────────────────────────────────────────────────────────────────────

type: glance
title: Roboter
show_state: true
entities:
  - entity: vacuum.your_robot_1
    name: Roboter 1
  - entity: vacuum.your_robot_2
    name: Roboter 2

---
# ──────────────────────────────────────────────────────────────────────────────
# FULL PANEL — both robots with individual controls (paste into a new view)
# ──────────────────────────────────────────────────────────────────────────────

type: vertical-stack
cards:

  - type: markdown
    content: "## 🤖 360 Saugroboter"

  # ── Robot 1 ──
  - type: entities
    title: Roboter 1
    entities:
      - entity: vacuum.your_robot_1
        name: Status
      - type: attribute
        entity: vacuum.your_robot_1
        attribute: battery_level
        name: Akku
        suffix: "%"
        icon: mdi:battery

  - type: horizontal-stack
    cards:
      - type: button
        name: Start
        icon: mdi:play
        icon_height: 30px
        tap_action:
          action: call-service
          service: vacuum.start
          target:
            entity_id: vacuum.your_robot_1
      - type: button
        name: Pause
        icon: mdi:pause
        icon_height: 30px
        tap_action:
          action: call-service
          service: vacuum.pause
          target:
            entity_id: vacuum.your_robot_1
      - type: button
        name: Basis
        icon: mdi:home-map-marker
        icon_height: 30px
        tap_action:
          action: call-service
          service: vacuum.return_to_base
          target:
            entity_id: vacuum.your_robot_1

  - type: divider

  # ── Robot 2 ──
  - type: entities
    title: Roboter 2
    entities:
      - entity: vacuum.your_robot_2
        name: Status
      - type: attribute
        entity: vacuum.your_robot_2
        attribute: battery_level
        name: Akku
        suffix: "%"
        icon: mdi:battery

  - type: horizontal-stack
    cards:
      - type: button
        name: Start
        icon: mdi:play
        icon_height: 30px
        tap_action:
          action: call-service
          service: vacuum.start
          target:
            entity_id: vacuum.your_robot_2
      - type: button
        name: Pause
        icon: mdi:pause
        icon_height: 30px
        tap_action:
          action: call-service
          service: vacuum.pause
          target:
            entity_id: vacuum.your_robot_2
      - type: button
        name: Basis
        icon: mdi:home-map-marker
        icon_height: 30px
        tap_action:
          action: call-service
          service: vacuum.return_to_base
          target:
            entity_id: vacuum.your_robot_2
